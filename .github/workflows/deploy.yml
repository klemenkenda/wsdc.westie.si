name: Deploy wsdc.westie.si

# Everything lives under /domains/wsdc.westie.si/, in the layout the app expects —
# the scraper and the Laravel app both resolve data/ and slo_wsdc_ids.csv one level
# above web/ (dirname(base_path())):
#
#   public_html/       → docroot; index.php reaches into ../web/
#   web/               → Laravel app, vendor/ included (no composer on the host)
#   scraper/           → CLI scraper, also run from /admin and by cron
#   data/              → written by the scraper on the server. Never uploaded, only created.
#   slo_wsdc_ids.csv   → edited on the server through /admin. Uploaded only when asked for,
#                        via the "publish_ids" input on a manual run, because uploading it
#                        overwrites dancers added through the live admin page.
#
# Each upload keeps its own state file on the server; sharing one would make each step
# look like a wholesale deletion to the other. The action only deletes files listed in
# its own state, so whatever the app writes on the server (data/, storage/) is left alone.

on:
  push:
    branches: [main]
    paths:
      - "public_html/**"
      - "web/**"
      - "scraper/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      publish_ids:
        description: "Also upload slo_wsdc_ids.csv — OVERWRITES the dancer list on the server, dropping dancers added through /admin"
        type: boolean
        default: false

# An overlapping run would race the state files on the server.
concurrency:
  group: deploy-wsdc-westie-si
  cancel-in-progress: false

env:
  ROOT: /domains/wsdc.westie.si

jobs:
  deploy:
    name: FTPS deploy
    runs-on: ubuntu-latest
    # The first run uploads all of web/vendor/ (~77 MB, thousands of files).
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # web/.env is not in the repo. It is written here from secrets, so the server copy
      # is always the one this workflow produced.
      - name: Write web/.env
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          SCRAPER_SECRET: ${{ secrets.SCRAPER_SECRET }}
        run: |
          if [ -z "$APP_KEY" ] || [ -z "$SCRAPER_SECRET" ]; then
            echo "::error::Secrets APP_KEY and SCRAPER_SECRET must be set on the repository."
            exit 1
          fi
          cat > web/.env <<EOF
          APP_NAME="SLO WSDC Ranking"
          APP_ENV=production
          APP_KEY=$APP_KEY
          APP_DEBUG=false
          APP_URL=https://wsdc.westie.si

          LOG_CHANNEL=single
          LOG_LEVEL=error

          SESSION_DRIVER=file
          CACHE_STORE=file

          SCRAPER_SECRET=$SCRAPER_SECRET
          PHP_CLI_BIN=/opt/alt/php83/usr/bin/php
          EOF
          sed -i 's/^ *//' web/.env

      # FTP does not create empty directories, and the .gitignore files that keep Laravel's
      # runtime folders in the repo are excluded from the upload. A .keep in each one makes
      # them exist on the server.
      - name: Mark runtime directories
        run: |
          for d in web/storage/logs web/storage/app/private web/storage/app/public \
                   web/storage/framework/cache/data web/storage/framework/sessions \
                   web/storage/framework/views web/bootstrap/cache; do
            mkdir -p "$d" && touch "$d/.keep"
          done
          mkdir -p deploy-data/raw && touch deploy-data/.keep deploy-data/raw/.keep
          mkdir -p deploy-ids && cp slo_wsdc_ids.csv deploy-ids/

      - name: Deploy docroot
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 6021
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public_html/
          server-dir: ${{ env.ROOT }}/public_html/
          state-name: .deploy-public.json
          exclude: |
            **/.git*
            **/.git*/**

      # web/vendor/ is ~8,600 files. Sent one by one over FTP it runs ~3 s a file, and the
      # host drops the connection after ~15 minutes, long before the end. So it goes up as a
      # single zip that a one-off PHP script unpacks next to the live copy and swaps in.
      # The script's URL carries a token generated for this run only, and it deletes itself
      # and the zip when done. Skipped when the server's vendor/ was built from the same
      # composer.lock — the hash is stored in web/vendor/.composer-lock.sha256.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy web/vendor (zip)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp_run() {
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 6021 "$FTP_SERVER" -e "
              set ftp:ssl-force true; set ftp:ssl-protect-data true;
              set ssl:verify-certificate false; set net:max-retries 3; set net:timeout 30;
              $1; bye"
          }

          want=$(sha256sum web/composer.lock | cut -d' ' -f1)
          have=$(lftp_run "cat $ROOT/web/vendor/.composer-lock.sha256" 2>/dev/null | tr -d '[:space:]' || true)
          echo "composer.lock: local $want, server ${have:-(none)}"
          if [ "$want" = "$have" ]; then
            echo "Server vendor/ is current — skipping."
            exit 0
          fi

          echo "$want" > web/vendor/.composer-lock.sha256
          (cd web && zip -qr ../vendor.zip vendor)
          ls -lh vendor.zip

          token=$(openssl rand -hex 24)
          script="_vendor_$token.php"
          cat > "$script" <<'PHP'
          <?php
          // One-off: unpack ../vendor.zip into ../web/vendor. Written and removed by deploy.yml.
          set_time_limit(0);
          header('Content-Type: text/plain');
          $root = dirname(__DIR__);
          $zipPath = "$root/vendor.zip";
          $fail = function (string $msg) { http_response_code(500); echo "FAIL: $msg\n"; @unlink(__FILE__); exit; };
          function rrmdir(string $d): void {
              if (!is_dir($d)) return;
              $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($d, FilesystemIterator::SKIP_DOTS), RecursiveIteratorIterator::CHILD_FIRST);
              foreach ($it as $f) { $f->isDir() ? rmdir($f->getPathname()) : unlink($f->getPathname()); }
              rmdir($d);
          }
          if (!class_exists('ZipArchive')) $fail('PHP zip extension missing');
          $zip = new ZipArchive();
          if ($zip->open($zipPath) !== true) $fail("cannot open $zipPath");
          $stage = "$root/web/.vendor_stage";
          rrmdir($stage);
          mkdir($stage);
          if (!$zip->extractTo($stage)) $fail('extract failed');
          $zip->close();
          $old = "$root/web/.vendor_old";
          rrmdir($old);
          if (is_dir("$root/web/vendor") && !rename("$root/web/vendor", $old)) $fail('cannot move old vendor aside');
          if (!rename("$stage/vendor", "$root/web/vendor")) $fail('cannot move new vendor in');
          rrmdir($stage);
          rrmdir($old);
          unlink($zipPath);
          echo "OK " . trim(file_get_contents("$root/web/vendor/.composer-lock.sha256")) . "\n";
          unlink(__FILE__);
          PHP
          sed -i 's/^ *//' "$script"

          lftp_run "put vendor.zip -o $ROOT/vendor.zip; put $script -o $ROOT/public_html/$script"
          out=$(curl -sS --max-time 600 "https://wsdc.westie.si/$script" || true)
          echo "$out"
          # Belt and braces: the script removes both itself, but not if PHP never ran.
          lftp_run "rm -f $ROOT/public_html/$script; rm -f $ROOT/vendor.zip" >/dev/null 2>&1 || true
          case "$out" in "OK $want"*) ;; *) echo "::error::vendor unpack did not confirm."; exit 1 ;; esac

      - name: Deploy app
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 6021
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./web/
          server-dir: ${{ env.ROOT }}/web/
          state-name: .deploy-web.json
          exclude: |
            **/.git*
            **/.git*/**
            .env.*
            vendor/**
            node_modules/**
            tests/**

      - name: Deploy scraper
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 6021
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./scraper/
          server-dir: ${{ env.ROOT }}/scraper/
          state-name: .deploy-scraper.json
          exclude: |
            **/.git*
            **/.git*/**

      # Only creates data/ and data/raw/; the scraper's output is never in this state file,
      # so it is never touched.
      - name: Create data directories
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 6021
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-data/
          server-dir: ${{ env.ROOT }}/data/
          state-name: .deploy-data.json

      - name: Publish slo_wsdc_ids.csv
        if: github.event_name == 'workflow_dispatch' && inputs.publish_ids
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          port: 6021
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy-ids/
          server-dir: ${{ env.ROOT }}/
          state-name: .deploy-ids.json

      # A green FTP run means "the files arrived", not "the site works". The layout's title
      # only renders if PHP 8.3 parsed Laravel, the rewrite applied and ../web/ resolved.
      - name: Smoke check
        run: |
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' --max-time 30 -L https://wsdc.westie.si/ || echo 000)
          echo "--- https://wsdc.westie.si/ -> $code"
          head -c 400 /tmp/home.html 2>/dev/null || true
          echo

          case "$code" in
            200)
              if ! grep -qE "SLO WSDC Ranking|Slovenian West Coast Swing" /tmp/home.html; then
                echo "::error::HTTP 200 but not the app — the host's placeholder index.html, or another page, is answering."
                exit 1
              fi ;;
            000) echo "::error::No response at all: DNS, TLS or the host being down."; exit 1 ;;
            500) echo "::error::HTTP 500 — check web/storage/logs/laravel.log, that PHP 8.3 is selected (public_html/.htaccess) and that web/.env arrived."; exit 1 ;;
            *)   echo "::error::Unexpected reply (HTTP $code)."; exit 1 ;;
          esac
