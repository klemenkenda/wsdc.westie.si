services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: wsdc_php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      # Mount entire repo so scraper and web app share the same data/ folder
      - .:/var/www
    networks:
      - wsdc

  nginx:
    image: nginx:1.27-alpine
    container_name: wsdc_nginx
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - wsdc

networks:
  wsdc:
    driver: bridge
