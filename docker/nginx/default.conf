server {
    listen 80;
    server_name localhost;

    # Laravel public root (created later in web/)
    root /var/www/web/public;
    index index.php index.html;

    charset utf-8;

    # Laravel-style front-controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP requests to php-fpm\n    location ~ \.php$ {
        fastcgi_pass   wsdc_php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Don't log favicon / robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_log  /var/log/nginx/wsdc_error.log;
    access_log /var/log/nginx/wsdc_access.log;
}
